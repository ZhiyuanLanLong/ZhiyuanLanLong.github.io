<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container" class="container">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirm-password" placeholder="Confirm Password" required>
        <button id="login-btn">Log In</button>
        <button id="signup-btn">Sign Up</button>
        <p id="error-msg"></p>
    </div>
    <div id="welcome-container" class="container hidden card-container">
        <button id="logout-btn" class="logout-small">Log Out</button>
        <p id="loading-spinner">Decrypting data...</p>
        <div id="profile-card" class="hidden">
            <img id="profile-avatar" src="" alt="Profile Picture">
            <h2 id="profile-name"></h2>
            <h4 id="profile-role"></h4>
            <div class="divider"></div>
            <p id="profile-bio"></p>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
